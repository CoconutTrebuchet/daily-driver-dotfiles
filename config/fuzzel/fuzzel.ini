[main]
icons-enabled=yes
icon-theme=Qogir-Dark
font=Adwaita Sans:size=17
width=32
lines=10
terminal="alacritty -e {cmd}"
horizontal-pad=25
inner-pad=2
dpi-aware=no

[border]
radius=0

[colors]
background=#0d0d0dff
text=#e6e6e6ff
selection=#242424ff
border=#242424ff
prompt=#bfbfbfff
input=#bfbfbfff
selection-text=#e6e6e6ff
match=#3f7aa6ff
selection-match=#3f7aa6ff
