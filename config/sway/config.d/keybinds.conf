# Variables
#
set $mod Mod4
set $left h
set $down j
set $up k
set $right l
set $term alacritty
# fuzzel is launched this way to make QT apps honor the
# QT_GPA_PLATFORMTHEME=gtk3 environment variable
set $menu "sh -c 'fuzzel'"

# Basics:
#
bindsym $mod+Return exec $term
bindsym $mod+Shift+q kill
floating_modifier $mod normal
bindsym $mod+Shift+r reload
bindsym $mod+u [urgent=latest] focus 
bindsym $mod+n exec swaync-client -t -sw
bindsym $mod+m exec pkill -SIGUSR1 waybar
bindsym $mod+Shift+e exec wlogout -m 330
bindsym $mod+d exec $menu
bindsym F8 exec $HOME/.config/sway/scripts/toggle-profiles.sh

# Moving around:
#
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right

bindsym $mod+Shift+$left move left 40px
bindsym $mod+Shift+$down move down 40px
bindsym $mod+Shift+$up move up 40px
bindsym $mod+Shift+$right move right 40px

bindsym $mod+Ctrl+$left move left 20px
bindsym $mod+Ctrl+$down move down 20px
bindsym $mod+Ctrl+$up move up 20px
bindsym $mod+Ctrl+$right move right 20px

bindsym $mod+c move position center

# Workspaces:
#
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9

bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
# Note: workspaces can have any name you want, not just numbers.
# We just use 1-10 as the default.

# Layout:
#
bindsym $mod+b splith
bindsym $mod+v splitv

bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split

bindsym $mod+f fullscreen
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle

#bindsym $mod+a focus parent
#bindsym $mod+Shift+a focus child
bindsym $mod+i focus parent
bindsym $mod+o focus child

# Scratchpad:
#
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

# Resize mode:
#
mode "resize" {
bindsym $left resize shrink width 40px
bindsym $down resize grow height 40px
bindsym $up resize shrink height 40px
bindsym $right resize grow width 40px

bindsym Shift+$left resize shrink width 20px
bindsym Shift+$down resize grow height 20px
bindsym Shift+$up resize shrink height 20px
bindsym Shift+$right resize grow width 20px

bindsym Return mode "default"
bindsym Escape mode "default"
bindsym space mode "default"
}
bindsym $mod+r mode "resize"

# Passthrough mode:
mode "passthru" {
bindsym $mod+Shift+Escape mode "default"
}
bindsym $mod+Shift+p mode "passthru"

# Utilities:
#
# Audio
bindsym --locked XF86AudioMute exec exec pactl set-sink-mute \@DEFAULT_SINK@ toggle
bindsym --locked XF86AudioMicMute exec pactl set-source-mute \@DEFAULT_SOURCE@ toggle
bindsym --locked XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -5%
bindsym --locked Shift+XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -1%
bindsym --locked XF86AudioRaiseVolume exec $HOME/.config/sway/scripts/volume-up.sh 5
bindsym --locked Shift+XF86AudioRaiseVolume exec $HOME/.config/sway/scripts/volume-up.sh 1

# Brightness
bindsym --locked XF86MonBrightnessDown exec $HOME/.config/sway/scripts/brightness-down.sh 5
bindsym --locked Shift+XF86MonBrightnessDown exec $HOME/.config/sway/scripts/brightness-down.sh 1
bindsym --locked XF86MonBrightnessUp exec brightnessctl set 5%+
bindsym --locked Shift+XF86MonBrightnessUp exec brightnessctl set 1%+

# Screenshots
bindsym Print exec $HOME/.config/sway/scripts/screenshot.sh
bindsym XF86SelectiveScreenshot exec $HOME/.config/sway/scripts/screen-snip.sh
